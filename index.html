<style>
  .floating-heart {
    position: fixed;
    bottom: -30px;
    z-index: 9999;
    pointer-events: none;
    animation: popIn 0.18s ease-out forwards, floatUp 2.6s ease-in forwards;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }

  @keyframes popIn {
    0% { transform: scale(0.3); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  @keyframes floatUp {
    0% {
      transform: translateX(0) translateY(0) scale(0.9);
      opacity: 0;
    }
    10% { opacity: 1; }
    100% {
      transform: translateX(var(--drift)) translateY(-110vh) scale(1.25);
      opacity: 0;
    }
  }
</style>
<script>
  // codename: red
  let scale = 1;
  let heartInterval = null;

  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const msg = document.getElementById("message");

  function spawnHeart() {
    const heart = document.createElement("div");
    heart.textContent = "❤️";
    heart.className = "floating-heart";

    heart.style.left = Math.random() * 100 + "vw";

    const size = 18 + Math.random() * 22;
    heart.style.fontSize = size + "px";

    heart.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");

    document.body.appendChild(heart);
    heart.addEventListener("animationend", () => heart.remove());
  }

  no.addEventListener("click", () => {
    scale = Math.min(scale + 0.2, 2.5);
    yes.style.transform = `scale(${scale})`;
    msg.textContent = "Are you sure? 🥺";
  });

  yes.addEventListener("click", () => {
    msg.textContent = "I love you! ❤️";
    yes.disabled = true;
    no.disabled = true;

    spawnHeart();
    heartInterval = setInterval(spawnHeart, 220);

    setTimeout(() => {
      clearInterval(heartInterval);
      heartInterval = null;
    }, 6000);
  });
</script>
