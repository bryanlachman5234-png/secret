<script>
  // codename: red
  let scale = 1;
  let heartInterval = null;

  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const msg = document.getElementById("message");

  // Create and animate one floating heart
  function spawnHeart() {
    const heart = document.createElement("div");
    heart.textContent = "❤️";
    heart.className = "floating-heart";

    // Random horizontal position
    heart.style.left = Math.random() * 100 + "vw";

    // Random size
    const size = 18 + Math.random() * 22; // 18px to 40px
    heart.style.fontSize = size + "px";

    // Random drift
    heart.style.setProperty("--drift", (Math.random() * 120 - 60) + "px");

    document.body.appendChild(heart);

    // Remove after animation
    heart.addEventListener("animationend", () => heart.remove());
  }

  no.addEventListener("click", () => {
    scale = Math.min(scale + 0.2, 2.5);
    yes.style.transform = `scale(${scale})`;
    msg.textContent = "Are you sure? 🥺";
  });

  yes.addEventListener("click", () => {
    msg.textContent = "I love you! ❤️";
    yes.disabled = true;
    no.disabled = true;

    // Start hearts
    spawnHeart();
    heartInterval = setInterval(spawnHeart, 220);

    // Optional: stop hearts after a bit (comment out if you want infinite hearts)
    setTimeout(() => {
      clearInterval(heartInterval);
      heartInterval = null;
    }, 6000);
  });
</script>
