<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- codename: red -->
  <title>red</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2b0a1f, #4b0f2d);
      font-family: system-ui, sans-serif;
      color: white;
      padding: 20px;
    }

    .card {
      max-width: 800px;
      width: 100%;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      overflow: hidden;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 24px 16px 12px;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 800;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 24px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #yes {
      background: linear-gradient(135deg, #ff3b76, #ff7aa8);
    }

    #no {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    #message {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Image must be in repo root -->
    <img src="valentine.png" alt="Valentine Art" />

    <h1>Will you be my Valentine Danika?</h1>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙈</button>
    </div>

    <div id="message"></div>
  </div>

  <script>
    // codename: red
    let scale = 1;

    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const msg = document.getElementById("message");

    no.addEventListener("click", () => {
      scale = Math.min(scale + 0.2, 2.5);
      yes.style.transform = `scale(${scale})`;
      msg.textContent = "Are you sure? 🥺";
    });

    yes.addEventListener("click", () => {
      msg.textContent = "YAY!!! 💘💘💘";
      yes.disabled = true;
      no.disabled = true;
    });
  </script>

</body>
</html>
